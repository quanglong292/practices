services:
  postgres:
    image: postgres:16-alpine
    container_name: practice_docker_db_pgsql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: practice_db_pgsql
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
